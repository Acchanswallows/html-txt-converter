<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTML → TXT 一括変換ツール</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px 14px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;color:#172033}
main{max-width:760px;margin:auto}.panel{background:#fff;border:1px solid #dce2ec;border-radius:16px;padding:20px;box-shadow:0 3px 14px #1720330b}
h1{font-size:clamp(22px,5vw,30px);margin:0 0 8px}.intro{color:#596579;line-height:1.65;margin:0 0 20px}
.drop{display:block;border:2px dashed #9aa8bd;border-radius:12px;padding:26px 14px;text-align:center;background:#fafcff;cursor:pointer}
.drop strong{display:block;font-size:17px;margin-bottom:6px}.drop span{font-size:14px;color:#596579}
input[type=file]{display:block;max-width:100%;margin:14px auto 0}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
button{border:0;border-radius:10px;padding:12px 16px;font-size:15px;font-weight:650;cursor:pointer;background:#175cd3;color:white}
button.alt{background:#e9eef7;color:#172033}button:disabled{opacity:.45;cursor:not-allowed}
.option{display:flex;gap:8px;align-items:center;margin-top:14px;font-size:14px;color:#46536a}
#status{font-size:14px;color:#46536a;line-height:1.6;margin:16px 0 0}
ul{padding:0;list-style:none;margin:12px 0 0}li{padding:9px 0;border-bottom:1px solid #edf0f5;overflow-wrap:anywhere;font-size:14px}
.results{margin-top:20px}.result{border:1px solid #dce2ec;border-radius:12px;padding:14px;margin-top:12px}.result h3{font-size:15px;margin:0 0 10px;overflow-wrap:anywhere}
textarea{width:100%;min-height:130px;resize:vertical;border:1px solid #cbd4e1;border-radius:8px;padding:10px;font:13px/1.5 ui-monospace,monospace}
.result button{margin:8px 8px 0 0}.hint{font-size:13px;color:#596579;line-height:1.6;margin-top:18px}
@media(max-width:520px){body{padding:16px 10px}.panel{padding:14px}.actions{display:grid;grid-template-columns:1fr}.actions button{width:100%}.drop{padding:22px 10px}}
</style>
</head>
<body>
<main>
<h1>HTML → TXT 一括変換ツール</h1>
<p class="intro">複数のHTMLファイルを選択し、文章を抽出してTXTファイルとして保存できます。変換モードを選べます。変換処理はこのブラウザ内で行います。</p>
<section class="panel">
<label class="drop" for="files"><strong>HTMLファイルを選択</strong><span>複数ファイルをまとめて選べます</span><input id="files" type="file" accept=".html,.htm,text/html" multiple></label>
<fieldset style="margin-top:16px;border:1px solid #dce2ec;border-radius:12px;padding:12px"><legend><b>変換モード</b></legend><label style="display:block;margin:8px 0"><input type="radio" name="mode" value="source" checked> ソースコードをそのまま残す</label><label style="display:block;margin:8px 0"><input type="radio" name="mode" value="text"> HTMLタグを除去して文章だけ抽出</label></fieldset><label class="option"><input id="urls" type="checkbox"> リンク先URLも文章に含める</label>
<div class="actions">
<button id="convert" disabled>TXTに変換</button>
<button id="downloadAll" class="alt" disabled>すべてZIPでダウンロード</button>
<button id="clear" class="alt" disabled>選択をクリア</button>
</div>
<p id="status" aria-live="polite">HTMLファイルを選択してください。</p>
<ul id="filelist"></ul>
<div id="results" class="results" hidden><strong id="resultTitle"></strong><div id="resultList"></div></div>
</section>
<p class="hint">※ 文章抽出モードではscript・styleなどを除外します。ソースコード保持モードでは元のテキストを変更しません。見出し・段落・リストは可能な範囲で改行に変換します。元ファイルは変更しません。</p>
</main>
<script>
(()=>{
const $=id=>document.getElementById(id);let files=[],outputs=[];
const fileInput=$('files');
fileInput.addEventListener('change',()=>{
 files=Array.from(fileInput.files||[]);outputs=[];$('results').hidden=true;
 $('filelist').replaceChildren();
 files.forEach(f=>{const li=document.createElement('li');li.textContent='📄 '+f.name+' ('+(f.size/1024).toFixed(1)+' KB)';$('filelist').append(li)});
 $('convert').disabled=!files.length;$('clear').disabled=!files.length;$('downloadAll').disabled=true;
 $('status').textContent=files.length+' 件のHTMLファイルを選択中です。';
});
function extract(source){
 const doc=new DOMParser().parseFromString(source,'text/html');
 doc.querySelectorAll('script,style,noscript,template,svg,canvas,iframe,object,embed').forEach(e=>e.remove());
 if($('urls').checked)doc.querySelectorAll('a[href]').forEach(a=>{const u=a.getAttribute('href');if(u&&!u.startsWith('#')&&!/^javascript:/i.test(u))a.append(doc.createTextNode(' ('+u+')'))});
 doc.querySelectorAll('br,hr').forEach(e=>e.replaceWith(doc.createTextNode('\n')));
 doc.querySelectorAll('p,div,section,article,header,footer,nav,main,aside,blockquote,pre,h1,h2,h3,h4,h5,h6,li,tr,dd,dt').forEach(e=>e.append(doc.createTextNode('\n')));
 doc.querySelectorAll('li').forEach(e=>e.prepend(doc.createTextNode('・')));
 return (doc.body?.textContent||'').replace(/\r\n?/g,'\n').replace(/[ \t]+\n/g,'\n').replace(/\n[ \t]+/g,'\n').replace(/[ \t]{2,}/g,' ').replace(/\n{3,}/g,'\n\n').trim()+'\n';
}
function filename(name){return name.replace(/\.(html?|HTML?)$/i,'').replace(/[\\/:*?"<>|]/g,'_')+'.txt'}
function download(text,name){
 const blob=new Blob(['\ufeff',text],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
}
$('convert').addEventListener('click',async()=>{
 $('convert').disabled=true;$('status').textContent='変換しています…';outputs=[];
 try{for(const f of files)outputs.push({name:filename(f.name),text:document.querySelector('input[name=mode]:checked').value==='source'?await f.text():extract(await f.text())});
 $('resultList').replaceChildren();
 outputs.forEach(o=>{
  const card=document.createElement('div');card.className='result';const h=document.createElement('h3');h.textContent=o.name;
  const ta=document.createElement('textarea');ta.readOnly=true;ta.value=o.text;
  const b=document.createElement('button');b.textContent='このTXTをダウンロード';b.addEventListener('click',()=>download(o.text,o.name));
  const c=document.createElement('button');c.className='alt';c.textContent='文章をコピー';c.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(o.text);$('status').textContent=o.name+' をコピーしました。'}catch(e){ta.focus();ta.select();$('status').textContent='文章を選択しました。コピーしてください。'}});
  card.append(h,ta,b,c);$('resultList').append(card);
 });
 $('results').hidden=false;$('resultTitle').textContent=outputs.length+' 件の変換が完了しました';$('downloadAll').disabled=!outputs.length;
 $('status').textContent='変換が完了しました。各ファイルを個別に保存するか、まとめてダウンロードできます。';
 }catch(e){$('status').textContent='変換中にエラーが発生しました: '+e.message}
 $('convert').disabled=!files.length;
});
function zipEntries(entries){
 const enc=new TextEncoder(),parts=[],central=[];let offset=0;
 const table=Array.from({length:256},(_,n)=>{let c=n;for(let k=0;k<8;k++)c=(c&1)?0xedb88320^(c>>>1):c>>>1;return c>>>0});
 const u16=n=>[n&255,(n>>>8)&255],u32=n=>[n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255];
 for(const e of entries){const name=enc.encode(e.name),data=enc.encode(e.text);let crc=0xffffffff;for(const b of data)crc=table[(crc^b)&255]^(crc>>>8);crc=(crc^0xffffffff)>>>0;
 const local=new Uint8Array([80,75,3,4,...u16(20),...u16(0x800),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0)]);
 const cd=new Uint8Array([80,75,1,2,...u16(20),...u16(20),...u16(0x800),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(offset)]);
 parts.push(local,name,data);central.push(cd,name);offset+=local.length+name.length+data.length;
 }
 const cdSize=central.reduce((n,p)=>n+p.length,0),end=new Uint8Array([80,75,5,6,...u16(0),...u16(0),...u16(entries.length),...u16(entries.length),...u32(cdSize),...u32(offset),...u16(0)]);
 return new Blob([...parts,...central,end],{type:'application/zip'});
}
$('downloadAll').addEventListener('click',()=>{const url=URL.createObjectURL(zipEntries(outputs));const a=document.createElement('a');a.href=url;a.download='converted_txt.zip';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);$('status').textContent='ZIPのダウンロードを開始しました。'});
$('clear').addEventListener('click',()=>{files=[];outputs=[];fileInput.value='';$('filelist').replaceChildren();$('resultList').replaceChildren();$('results').hidden=true;$('convert').disabled=true;$('downloadAll').disabled=true;$('clear').disabled=true;$('status').textContent='HTMLファイルを選択してください。'});
})();
</script>
</body></html>
